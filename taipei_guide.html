<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>타이베이 가족여행</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
/* Layout: sticky header with day tabs; each day is a vertical timeline — stops as rows, moves as indented rail segments colored by Taipei Metro line */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --ink:#1d2421; --muted:#5f6b66; --line:#dde2dd;
  --accent:#c2362b; --accent-soft:#fbe9e6; --rail:#c9d0cb; --chip:#eef1ee;
  --ok:#2f7d4f;
  --BL:#0070bd; --R:#e3002c; --G:#008659; --BR:#b07b22; --O:#d99a00; --BUS:#55606a;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --ink:#e7ece9; --muted:#9aa7a1; --line:#2b3430;
  --accent:#ff6b5c; --accent-soft:#3a1f1c; --rail:#3a4540; --chip:#232b27; --ok:#6cc792;
  --BL:#3d9be0; --R:#ff4d64; --G:#2fb37e; --BR:#d9a24a; --O:#f5bf3a; --BUS:#94a0aa;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --ink:#e7ece9; --muted:#9aa7a1; --line:#2b3430;
  --accent:#ff6b5c; --accent-soft:#3a1f1c; --rail:#3a4540; --chip:#232b27; --ok:#6cc792;
  --BL:#3d9be0; --R:#ff4d64; --G:#2fb37e; --BR:#d9a24a; --O:#f5bf3a; --BUS:#94a0aa;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.head{padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.flights{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:8px 10px 10px;border-bottom:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tab b{font-family:var(--f-mono);font-size:13px;font-weight:600}
.tab small{font-size:12px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.today{display:inline-block;font-size:10px;background:var(--accent);color:#fff;border-radius:4px;padding:0 4px;margin-top:2px}
main{padding-block:18px 48px}
.dayhead{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.dayhead h2{margin:0;font-size:22px;text-wrap:balance}
.dayhead .meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;background:var(--chip);border-radius:999px;padding:3px 10px;color:var(--muted)}
.pill strong{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.daynote{font-size:13.5px;color:var(--muted);margin:0}
/* timeline */
.tl{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:50px 1fr;gap:10px;padding-block:10px}
.time{font-family:var(--f-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:2px;color:var(--ink)}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card.optional{border-style:dashed}
.ko{font-weight:600;font-size:15.5px}
.zhrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zh{font-family:var(--f-zh);font-size:15px;font-weight:500;min-width:0;overflow-wrap:anywhere;user-select:all}
.note{font-size:13px;color:var(--muted);margin:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:32px}
.btn.copy{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.done{border-color:var(--ok);color:var(--ok);background:transparent}
.move{display:grid;grid-template-columns:50px 1fr;gap:10px}
.move .railcol{display:flex;justify-content:center}
.move .railcol i{width:0;border-left:2px dashed var(--rail);height:100%}
.mv{min-width:0;display:flex;flex-direction:column;gap:5px;padding:6px 0 6px 2px;font-size:13px;color:var(--muted)}
.mvtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode{font-size:11.5px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--ink)}
.dur{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-size:12.5px}
.seg{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:6px}
.path{min-width:0}
.ln{font-family:var(--f-mono);font-size:11px;font-weight:600;color:#fff;border-radius:4px;padding:1px 6px}
.st{font-family:var(--f-zh);color:var(--ink);font-size:13.5px}
.arrow{color:var(--muted)}
.st em{font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.dir{font-size:12.5px;color:var(--muted);padding-left:34px;margin-top:-2px}
.dir b{color:var(--ink);font-weight:600}
dl.info{margin:2px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
dl.info dt{font-weight:600;color:var(--accent);white-space:nowrap}
dl.info dd{margin:0;min-width:0}
h3.bfg{font-size:15px;margin:18px 0 8px}
.bflist{display:flex;flex-direction:column;gap:10px}
.pick{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:4px;padding:1px 6px;vertical-align:2px}
/* info */
section.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
section.box h3{margin:0;font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.check small{display:block;color:var(--muted);font-size:12.5px}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.show{font-family:var(--f-zh);font-size:22px;font-weight:700;line-height:1.4;background:var(--bg);border-radius:8px;padding:12px;overflow-wrap:anywhere}
.phr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.phr:first-of-type{border-top:0;padding-top:0}
.phr .zh{font-size:16px}
.phr .k{font-size:12.5px;color:var(--muted)}
.conv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono)}
.conv input{font:inherit;width:120px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.conv output{font-size:18px;font-weight:600}
.tel{font-family:var(--f-mono);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

function renderTabs(cur){
  const tabs=DAYS.map(d=>`<button class="tab" role="tab" id="tab-${d.id}" aria-selected="${d.id===cur}" data-id="${d.id}"><b>${d.date}</b><small>${d.dow}</small>${d.day===todayDay?'<span class="today">오늘</span>':''}</button>`).join('')
   +`<button class="tab" role="tab" id="tab-breakfast" aria-selected="${cur==='breakfast'}" data-id="breakfast"><b>아침</b><small>식당</small></button>`
   +`<button class="tab" role="tab" id="tab-info" aria-selected="${cur==='info'}" data-id="info"><b>정보</b><small>준비·회화</small></button>`;
  $('#tabs').innerHTML=tabs;
}
function copyBtn(text,label){return `<button class="btn copy" data-copy="${esc(text)}">${esc(label||'복사')}</button>`}
function renderDay(d){
  const total=d.items.filter(i=>i.mv).reduce((a,i)=>a+i.min,0);
  let h=`<div class="dayhead"><h2>${d.date} (${d.dow}) ${esc(d.title)}</h2>
   <div class="meta"><span class="pill">이동 합계 <strong>${hm(total)}</strong></span><span class="pill">장소 <strong>${d.items.filter(i=>!i.mv&&i.zh).length}</strong>곳</span></div>
   <p class="daynote">${esc(d.note)}</p></div>`;
  if(d.todo) h+=`<section class="box"><h3>오늘 할 일</h3>${d.todo.map(([t,s],n)=>{const id='todo-'+d.id+'-'+n;return `<label class="check"><input type="checkbox" id="${id}" ${store.get('chk-'+id)==='1'?'checked':''}><span>${esc(t)}${s?`<small>${esc(s)}</small>`:''}</span></label>`}).join('')}</section>`;
  h+=`<div class="tl">`;
  d.items.forEach(i=>{
    if(i.mv){
      let segs='';
      if(i.bus&&i.segs&&i.txt==='환승 없이 직통') segs+=`<div class="seg"><span class="ln" style="background:var(--BUS)">BUS</span><span>${esc(i.bus)}</span></div>`;
      (i.segs||[]).forEach(s=>{segs+=`<div class="seg"><span class="ln" style="background:var(--${s[0]})">${s[0]}</span><span class="path"><span class="st">${esc(s[1])} <em>${esc(EN[s[1]]||'')}</em></span> <span class="arrow">→</span> <span class="st">${esc(s[2])} <em>${esc(EN[s[2]]||'')}</em></span></span></div>${s[3]?`<div class="dir">${LINE[s[0]]} <b>${esc(EN[s[3]]||'')} ${esc(s[3])} 방면</b> 타기</div>`:''}`});
      if(i.bus&&i.txt!=='환승 없이 직통') segs+=`<div class="seg"><span class="ln" style="background:var(--BUS)">BUS</span><span>${esc(i.bus)}</span></div>`;
      h+=`<div class="move"><div class="railcol"><i></i></div><div class="mv"><div class="mvtop"><span class="mode">${MODE[i.mv]}</span><span class="dur">약 ${hm(i.min)}</span>${i.txt?`<span>${esc(i.txt)}</span>`:''}</div>${segs}</div></div>`;
    }else{
      const q=i.q||i.zh||i.addr||i.ko;
      h+=`<div class="stop"><div class="time">${esc(i.t)}</div><div class="card${i.opt?' optional':''}">
        <div class="ko">${esc(i.ko)}</div>
        ${i.zh?`<div class="zhrow"><span class="zh" lang="zh-Hant">${esc(i.zh)}</span></div>`:''}
        ${i.addr?`<div class="zhrow"><span class="zh" lang="zh-Hant" style="font-size:13.5px;color:var(--muted)">${esc(i.addr)}</span></div>`:''}
        ${i.note?`<p class="note">${esc(i.note)}</p>`:''}
        ${INFO[i.ko]?`<dl class="info"><dt>특징</dt><dd>${esc(INFO[i.ko][0])}</dd><dt>꼭 볼 것</dt><dd>${esc(INFO[i.ko][1])}</dd><dt>특이사항</dt><dd>${esc(INFO[i.ko][2])}</dd></dl>`:''}
        <div class="acts">${i.zh?copyBtn(i.zh,i.label?i.label+' 복사':'이름 복사'):''}${i.addr?copyBtn(i.addr,'주소 복사'):''}<a class="btn" href="${mapUrl(q)}" target="_blank" rel="noopener">지도</a></div>
      </div></div>`;
    }
  });
  return h+'</div>';
}
function renderInfo(){
  const checks=RES.map(([id,t,s])=>`<label class="check"><input type="checkbox" id="${id}" ${store.get('chk-'+id)==='1'?'checked':''}><span>${esc(t)}${s?`<small>${esc(s)}</small>`:''}</span></label>`).join('');
  const ph=PHRASES.map(([k,z])=>`<div class="phr"><div><div class="zh" lang="zh-Hant">${esc(z)}</div><div class="k">${esc(k)}</div></div>${copyBtn(z)}</div>`).join('');
  return `<div class="dayhead"><h2>여행 정보</h2><p class="daynote">택시 기사에게 화면을 보여주거나, 중국어를 복사해서 번역 앱에 붙여 넣으세요.</p></div>
  <section class="box"><h3>택시 기사에게 보여주기</h3>
   <div class="show" lang="zh-Hant">請帶我到<br>${HOTEL_ZH}<br>${HOTEL_ADDR}</div>
   <div class="acts">${copyBtn('請帶我到 '+HOTEL_ZH+' '+HOTEL_ADDR,'중국어 복사')}<a class="btn" href="${mapUrl(HOTEL_ZH)}" target="_blank" rel="noopener">호텔 지도</a></div></section>
  <section class="box"><h3>예약 체크리스트</h3>${checks}<p class="note">체크 표시는 이 휴대폰에만 저장돼요.</p></section>
  <section class="box"><h3>환율 계산 (1 대만달러 ≈ 45원)</h3>
   <div class="conv"><label for="twd">NT$</label><input id="twd" type="number" inputmode="numeric" value="250" min="0"><span>≈</span><output id="krw"></output></div>
   <p class="note">대략적인 값이에요. 정확한 환율은 은행 앱에서 확인하세요.</p></section>
  <section class="box"><h3>유용한 중국어</h3>${ph}</section>
  <section class="box"><h3>긴급 연락처</h3>
   <div class="phr"><div><div class="tel">110</div><div class="k">경찰</div></div>${copyBtn('110')}</div>
   <div class="phr"><div><div class="tel">119</div><div class="k">구급 · 화재</div></div>${copyBtn('119')}</div>
   <div class="phr"><div><div class="tel">+82-2-3210-0404</div><div class="k">외교부 영사콜센터 (24시간)</div></div>${copyBtn('+82-2-3210-0404')}</div>
  </section>
  <section class="box"><h3>꼭 기억하기</h3>
   <p class="note">MRT 개찰구 안에서는 물·사탕·껌도 먹으면 안 돼요 · 에스컬레이터는 오른쪽에 서기 · 수돗물 마시지 않기 · 고기 가공품 반입 금지 · 보조배터리는 기내에</p></section>`;
}
function show(id){
  if(id!=='info'&&id!=='breakfast'&&!DAYS.some(d=>d.id===id)) id='d1';
  renderTabs(id);
  $('#main').innerHTML=id==='info'?renderInfo():id==='breakfast'?renderBF():renderDay(DAYS.find(d=>d.id===id));
  store.set('tab',id);
  const t=document.getElementById('tab-'+id); if(t&&t.scrollIntoView) t.scrollIntoView({block:'nearest',inline:'nearest'});
  if(id==='info') conv();
}
function conv(){const i=$('#twd'),o=$('#krw');if(!i)return;const v=Math.max(0,+i.value||0);o.textContent=Math.round(v*45).toLocaleString('ko-KR')+'원'}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function selectText(btn){const card=btn.closest('.card,.phr,.box');const el=card&&card.querySelector('.zh,.show,.tel');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(tab){const id=tab.dataset.id;if(location.hash!=='#'+id)location.hash=id;else show(id);window.scrollTo(0,0);return}
  const b=e.target.closest('[data-copy]');
  if(b){const text=b.dataset.copy,orig=b.textContent;
    const ok=()=>{b.classList.add('done');b.textContent='복사됨';toast('복사했어요: '+text);setTimeout(()=>{b.classList.remove('done');b.textContent=orig},1500)};
    const fail=()=>{selectText(b);toast('글자가 선택됐어요. 길게 눌러 복사하세요')};
    try{navigator.clipboard.writeText(text).then(ok,fail)}catch(err){fail()}
  }
});
document.addEventListener('change',e=>{if(e.target.matches('.check input'))store.set('chk-'+e.target.id,e.target.checked?'1':'0')});
document.addEventListener('input',e=>{if(e.target.id==='twd')conv()});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
const start=location.hash.slice(1)||(todayDay>=11&&todayDay<=15?'d'+(todayDay-10):store.get('tab'))||'d1';
show(start);
</script>

</body>
